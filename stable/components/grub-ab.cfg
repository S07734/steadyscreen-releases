# SteadyScreen A/B boot arbitration.
#
# This file lives on the ESP, which is shared by both slots. That is the whole
# point: grub-install's default puts the prefix and the config inside the root
# filesystem, so booting slot B still depended on slot A being intact -- an
# arbiter living inside one of the two things it arbitrates. A failed update
# could then take the machine down with no way back, which is precisely what
# A/B exists to prevent.
#
# Slots are found by LABEL (ds-root-a / ds-root-b), never by UUID, so nothing
# here has to be rewritten when a slot is reimaged.
#
#   ds_slot   the committed slot: what boots normally
#   ds_try    a one-shot attempt at the other slot, cleared before it is used
#
# The one-shot is what makes a bad update survivable. kiosk-osupdate sets
# ds_try and reboots; this clears it *before* handing over, so a slot that
# hangs or panics gets exactly one chance and the next boot falls back to
# ds_slot on its own, with nobody on site.

load_env

if [ -z "$ds_slot" ]; then set ds_slot="a"; fi

set target="$ds_slot"
if [ -n "$ds_try" ]; then
    set target="$ds_try"
    # Consume it now, not after a successful boot -- a slot that never reaches
    # userspace would otherwise retry for ever.
    set ds_try=
    save_env ds_try
fi

if [ "$target" = "b" ]; then
    set slot_label="ds-root-b"
else
    set slot_label="ds-root-a"
fi

set default=0
set timeout=0
set timeout_style=hidden

insmod all_video
insmod part_gpt
insmod ext2

# NO loadfont, and no gfxterm. This used to load unicode.pf2 off the ESP and
# switch to the graphical terminal, and it is the single line that stopped a
# Secure Boot machine dead.
#
# A Debian-signed GRUB verifies a font like anything else it is asked to load,
# and an unsigned one is refused:
#
#     error: prohibited by secure boot policy.
#
# The `if` catches the failure, so the config runs on -- but GRUB has already
# printed the error, and an error printed while a config is running makes it
# WAIT FOR A KEYPRESS. On a display converted from Windows there is nobody
# there to press anything, and the machine sits at a GRUB error screen until
# somebody drives to it. Measured in QEMU under Secure Boot on 2026-09-02;
# without this the whole feature would have shipped as a way of turning
# working machines into site visits.
#
# What it costs: the menu is drawn in the plain text console instead of a
# nicer font. The menu has timeout=0 and hidden style, so it is only ever seen
# by somebody holding shift to pick the other slot -- and plain text is
# perfectly usable for that. A prettier font on a screen nobody sees is not
# worth a machine that will not boot.

menuentry "SteadyScreen" {
    search --no-floppy --label --set=root $slot_label
    linux  /boot/vmlinuz root=LABEL=$slot_label ro quiet loglevel=3 \
           consoleblank=0 vt.global_cursor_default=0 fsck.repair=yes splash
    initrd /boot/initrd.img
}

# Deliberately reachable: if the committed slot is broken, holding shift and
# picking this is the difference between a five minute fix and a site visit.
menuentry "SteadyScreen (other slot)" {
    if [ "$slot_label" = "ds-root-a" ]; then
        set other="ds-root-b"
    else
        set other="ds-root-a"
    fi
    search --no-floppy --label --set=root $other
    linux  /boot/vmlinuz root=LABEL=$other ro quiet loglevel=3 \
           consoleblank=0 vt.global_cursor_default=0 fsck.repair=yes splash
    initrd /boot/initrd.img
}

menuentry "SteadyScreen (verbose)" {
    search --no-floppy --label --set=root $slot_label
    linux  /boot/vmlinuz root=LABEL=$slot_label ro fsck.repair=yes
    initrd /boot/initrd.img
}
